name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Test build logic
        run: ./gradlew -p build-logic build --no-daemon
      - name: Test framework modules
        run: ./gradlew :framework:testDebugUnitTest :framework-host:testDebugUnitTest :framework-ui:compileDebugKotlin --no-daemon
      - name: Test runtime staging helpers
        run: python3 -m unittest discover -s tools -p "test_*.py"
